<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Professional Calculator</title>
        <style>
            :root {
                --bg-dark: #020617;
                --panel: rgba(15, 23, 42, 0.9);
                --text: #f8fafc;
                --muted: #94a3b8;
                --accent: #22d3ee;
                --accent-2: #6366f1;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: radial-gradient(circle at top left, #1d4ed8 0%, #0f172a 45%, var(--bg-dark) 100%);
                color: var(--text);
            }

            body::before,
            body::after {
                content: "";
                position: fixed;
                width: 280px;
                height: 280px;
                border-radius: 50%;
                filter: blur(60px);
                opacity: 0.28;
                pointer-events: none;
                animation: drift 10s ease-in-out infinite alternate;
            }

            body::before {
                background: var(--accent);
                top: -80px;
                left: -90px;
            }

            body::after {
                background: #8b5cf6;
                right: -80px;
                bottom: -80px;
                animation-duration: 12s;
            }

            .calculator {
                width: min(92vw, 360px);
                padding: 24px;
                border-radius: 24px;
                background: var(--panel);
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(18px);
                animation: riseIn 0.8s ease both;
            }

            .calculator-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 14px;
            }

            .brand {
                font-size: 0.9rem;
                text-transform: uppercase;
                letter-spacing: 0.2em;
                color: var(--muted);
                font-weight: 700;
            }

            .status {
                font-size: 0.85rem;
                color: #7dd3fc;
            }

            #display {
                width: 100%;
                height: 72px;
                margin-bottom: 16px;
                padding: 14px 16px;
                border: none;
                border-radius: 16px;
                text-align: right;
                font-size: 28px;
                font-weight: 700;
                color: #0f172a;
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(226, 232, 240, 0.95));
                box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.15);
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                animation: glowPulse 2.8s ease-in-out infinite alternate;
            }

            #display:focus {
                outline: none;
                transform: translateY(-1px);
            }

            .buttons {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }

            button {
                height: 58px;
                border: none;
                border-radius: 14px;
                font-size: 20px;
                font-weight: 600;
                cursor: pointer;
                color: #fff;
                background: linear-gradient(145deg, #334155, #1e293b);
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
                transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
                animation: fadeUp 0.45s ease both;
            }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.24);
            }

            button:active {
                transform: scale(0.97);
            }

            button.operator {
                background: linear-gradient(135deg, #f59e0b, #d97706);
            }

            button.equal {
                background: linear-gradient(135deg, #10b981, #047857);
                grid-column: span 2;
            }

            button.clear {
                background: linear-gradient(135deg, #ef4444, #b91c1c);
            }

            @keyframes riseIn {
                from {
                    opacity: 0;
                    transform: translateY(20px) scale(0.97);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            @keyframes glowPulse {
                from {
                    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.15);
                }
                to {
                    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.15), 0 0 24px rgba(34, 211, 238, 0.24);
                }
            }

            @keyframes drift {
                from {
                    transform: translate(0, 0) scale(1);
                }
                to {
                    transform: translate(40px, -40px) scale(1.15);
                }
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="calculator">
            <div class="calculator-header">
                <div class="brand">Smart Calc</div>
                <div class="status">Live • Accurate</div>
            </div>
            <input type="text" id="display" disabled>
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>
                <button class="operator" onclick="appendValue('/')">÷</button>
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">−</button>
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>
        </div>

        <script>
            function appendValue(val) {
                document.getElementById("display").value += val;
            }

            function clearDisplay() {
                document.getElementById("display").value = "";
            }

            function calculate() {
                try {
                    const expression = document.getElementById("display").value;
                    // Safe expression evaluation without eval()
                    const result = Function('"use strict"; return (' + expression + ')')();
                    document.getElementById("display").value = result;
                } catch (e) {
                    document.getElementById("display").value = "Error";
                }
            }
        </script>
    </body>
</html>
